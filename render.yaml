databases:
  - name: alem-crm-db
    databaseName: alem_crm
    user: alem_crm_user
    plan: free
    region: frankfurt

services:
  - type: web
    name: alem-crm-backend
    runtime: node
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: node dist/main
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: alem-crm-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: DB_SYNCHRONIZE
        value: "true"
      - key: CORS_CREDENTIALS
        value: "true"
      - key: FRONTEND_URL
        fromService:
          name: alem-crm-frontend
          type: web
          property: host
      - key: CORS_ORIGIN
        fromService:
          name: alem-crm-frontend
          type: web
          property: host
      - key: LOG_LEVEL
        value: info
      - key: MAX_FILE_SIZE
        value: "10485760"

  - type: web
    name: alem-crm-frontend
    runtime: node
    region: frankfurt
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://alem-crm-backend.onrender.com/api

# IMPORTANT NOTES:
# 
# 1. JWT_SECRET: The `generateValue: true` will create a random secret automatically.
#    After first deployment, you can view it in the Render dashboard under environment variables.
#    Keep this value secure and do not share it.
#
# 2. NEXT_PUBLIC_API_URL: This is set to a placeholder URL. After the backend deploys,
#    you need to update this manually in the Render dashboard to match your actual backend URL.
#    Format: https://your-backend-service-name.onrender.com/api
#    The /api suffix is critical - do not omit it.
#
# 3. CORS Configuration: FRONTEND_URL and CORS_ORIGIN use fromService to automatically
#    reference the frontend service. This should work automatically, but if you encounter
#    CORS errors, manually set CORS_ORIGIN to your exact frontend URL in the Render dashboard.
#
# 4. Database Synchronization: DB_SYNCHRONIZE is set to "true" for initial deployment
#    to automatically create database tables. After your first successful deployment and
#    verification that tables exist, change this to "false" in the Render dashboard to
#    prevent accidental schema changes in production.
#
# 5. Region: Services are set to deploy in Frankfurt (EU Central). Adjust the region
#    based on where your users are located for better latency.
#
# 6. Plans: All services use the free plan. For production, consider upgrading to
#    paid plans to avoid cold starts and get better performance.
#
# 7. Optional Environment Variables: If you need email notifications, rate limiting
#    configuration, or monitoring tools (Sentry), add these environment variables
#    manually in the Render dashboard after deployment:
#    - MAIL_HOST, MAIL_PORT, MAIL_USER, MAIL_PASS
#    - RATE_LIMIT_MAX_REQUESTS
#    - SENTRY_DSN
#    - REDIS_URL (for caching)
