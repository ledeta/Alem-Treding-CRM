services:
  - type: web
    name: alem-crm-backend
    runtime: docker
    repo: https://github.com/miliyee/Alem-Treding
    branch: main
    dockerfile: ./backend/Dockerfile
    rootDir: ./backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '3001'
      - key: DATABASE_URL
        fromDatabase:
          name: alem-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: alem-redis
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: https://alem-treding.onrender.com
    healthCheckPath: /api/health
    numInstances: 1
    plan: starter

  - type: web
    name: alem-crm-frontend
    runtime: docker
    repo: https://github.com/miliyee/Alem-Treding
    branch: main
    dockerfile: ./frontend/Dockerfile
    rootDir: ./frontend
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '3000'
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: alem-crm-backend
          property: url
      - key: NEXTAUTH_URL
        value: https://alem-treding.onrender.com
      - key: NEXTAUTH_SECRET
        sync: false
    healthCheckPath: /
    numInstances: 1
    plan: starter

  - type: pserv
    name: alem-redis
    runtime: docker
    image:
      fromRegistry:
        url: redis:7-alpine
    plan: starter

databases:
  - name: alem-postgres
    databaseName: alem_crm
    user: postgres
    plan: starter
    region: oregon
    ipWhitelist: []
